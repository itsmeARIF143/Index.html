<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events/Tournaments | Elite Sports Club</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body>
    <!-- ইভেন্ট পেইজ: ভবিষ্যতে টুর্নামেন্ট যোগ করা যাবে -->
    <header class="site-header glass">
      <div class="container header-wrap">
        <a class="brand" href="../../index.html"><div class="logo">ESC</div><h1>Elite Sports Club</h1></a>
      </div>
    </header>

    <main class="container section">
      <h2>Events & Tournaments</h2>
      <div id="eventList" class="card-grid"></div>

      <!-- Optional Registration Form -->
      <section class="section card">
        <h3>Optional Registration</h3>
        <form id="eventRegisterForm">
          <div class="field"><label>Name</label><input type="text" required /></div>
          <div class="field"><label>Email</label><input type="email" required /></div>
          <div class="field"><label>Preferred Sport</label><input type="text" required /></div>
          <button class="btn" type="submit">Submit</button>
        </form>
      </section>
    </main>

    <script src="../../assets/js/script.js"></script>
  </body>
</html>
